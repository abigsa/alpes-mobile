name: mobile
description: Muebles de los Alpes - App oficial
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🔌 API y estado
  http: ^1.6.0
  provider: ^6.1.1
  shared_preferences: ^2.2.0
  go_router: ^13.0.0

  # 🎨 UI / UX
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  shimmer: ^3.0.0
  badges: ^3.1.2
  carousel_slider: ^4.2.1
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.2.1

  # 📸 Media
  image_picker: ^1.2.2
  http_parser: ^4.1.2

  # 📄 EXPORTACIÓN PROFESIONAL
  pdf: ^3.11.1
  printing: ^5.13.4
  excel: ^4.0.6
  file_saver: ^0.2.14
  archive: ^3.6.1   # 🔥 NECESARIO para gráficas reales en Excel

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true